model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  filename: checkpoint
  save_top_k: 1
  monitor: val/loss
  mode: min

generate_image:
  _target_: activediff.callbacks.GenerateImageCallback
  every_n_epochs: 100
  unet_depth: ${datamodule.unet_depth}

binarization_metric:
  _target_: activediff.callbacks.BinarizationMetricCallback
  every_n_epochs: 100
  unet_depth: ${datamodule.unet_depth}

multi_threshold_stopping:
  _target_: activediff.callbacks.MultiThresholdStopping
  warmup_epochs: 500
  conditions:
    - monitor: val/loss
      threshold: 0.01
      mode: min
    - monitor: val/bin
      threshold: 0.05
      mode: min

